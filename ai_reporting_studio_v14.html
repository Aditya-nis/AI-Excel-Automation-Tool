<script>
const $=s=>document.querySelector(s),fi=$('#fi'),sb=$('#sb');

const nf=n=>(+n).toLocaleString('en-IN',{maximumFractionDigits:2}),inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const fa=v=>st.P[st.R.a]&&st.P[st.R.a].t==='money'?inr(v):nf(v);
const fc=(v,k)=>typeof v==='number'?(k==='m'?fa(v):nf(v)):v,pl=s=>String(s).replace(/₹/g,'Rs ').replace(/✓/g,'OK').replace(/⚠/g,'CHECK').replace(/[–−]/g,'-').replace(/×/g,'x').replace(/▲/g,'+').replace(/▼/g,'-').replace(/●/g,'=');
const sum=(rows,h)=>rows.reduce((s,r)=>s+N(r[h]),0),M=r=>st.R.a?N(r[st.R.a]):1;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.t);t.t=setTimeout(()=>t.style.display='none',4500)};
function toD(v,hint){if(v instanceof Date)return isNaN(v)?null:((v.getHours()===23&&v.getMinutes()>=58)?new Date(v.getTime()+9e4):v);
 if(typeof v==='number')return hint&&v>20000&&v<70000?new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4):null;
 if(typeof v==='string'){v=v.trim();const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m){const A=st.mdy?+m[1]:+m[2],B=st.mdy?+m[2]:+m[1],d=new Date(+m[3],A-1,B);return d.getMonth()===A-1?d:null}
  if(/^\d{4}-\d{2}-\d{2}/.test(v)||(/\b(jan(uary)?|feb(ruary)?|mar(ch)?|apr(il)?|may|jun(e)?|jul(y)?|aug(ust)?|sep(t(ember)?)?|oct(ober)?|nov(ember)?|dec(ember)?)\b/i.test(v)&&/\d{4}/.test(v))){const d=new Date(v);return isNaN(d)?null:d}}return null}

/* ---------- load & profile ---------- */
function readFile(f){if(!f)return toast('Please upload an Excel or CSV file.');if(!/\.(xlsx|xls|csv)$/i.test(f.name))return toast('Supported formats are XLSX, XLS and CSV.');
 const rd=new FileReader();rd.onerror=()=>toast("Couldn't read this file.");rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});let rows=[];
  for(const n of wb.SheetNames){rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}).filter(r=>Object.values(r).some(v=>v!==''));if(rows.length)break}
  if(!rows.length)return toast("This file doesn't contain usable data.");const H=Object.keys(rows[0]);
  if(H.filter(h=>/^__EMPTY/.test(h)).length>H.length/2)return toast('Please provide a valid header row.');load(rows,f.name)}catch(x){toast("Couldn't read this file. Please check that it is a valid Excel or CSV file.")}};rd.readAsArrayBuffer(f)}
const detMdy=rows=>{let a=0,b=0;rows.slice(0,3000).forEach(r=>{for(const k in r){const v=r[k];if(typeof v==='string'){const m=v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.]\d{4}$/);if(m){if(+m[1]>12)a++;if(+m[2]>12)b++}}}});return b>0&&a===0};
function load(rows,name){st.mdy=detMdy(rows);st.o=rows;st.H=Object.keys(rows[0]);st.w=rows.map(r=>({...r}));st.fn=name.replace(/\.\w+$/,'');Object.assign(st,{fl:{},q:'',from:'',to:'',hist:[],rep:null,clean:false,pg:0,sk:null,hid:[],view:'dash'});$('#q').value='';
 try{st.pf=JSON.parse(localStorage.getItem('adb:'+st.H.join('|'))||'{}')}catch(e){st.pf={}}prof();prep();apply();render();
 const t=Object.values(st.P).map(p=>p.t),c=x=>t.filter(y=>y===x).length;
 toast(`File Analysis Complete ✓ Rows ${nf(st.w.length)} · Columns ${st.H.length} · Date ${c('date')} · Numeric ${c('money')+c('qty')+c('num')+c('pct')} · Text ${c('cat')+c('text')} · Status ${c('status')}`)}
function prof(){const{w,H}=st,P={};H.forEach(h=>{const hint=/date|time|day|dob|joining/i.test(h),vals=w.map(r=>r[h]).filter(v=>v!==''&&v!=null),n=vals.length||1,u=new Set(vals.map(v=>String(v).trim().toLowerCase())).size,dd=vals.filter(v=>toD(v,hint)).length,nn=vals.filter(isNum).length;let t='text';
 if(dd/n>=.8)t='date';
 else if(nn/n>=.8)t=/\b(id|no|number|code|phone|mobile|contact|ref)\b/i.test(h)&&u/n>.9?'id':/%|percent|discount|rate/i.test(h)?'pct':/value|amount|price|cost|worth|revenue|salary/i.test(h)?'money':/qty|quantity|units|stock|count|purchase/i.test(h)?'qty':/amount|total|sales|revenue|price|cost|salary|value|payment|fee|profit/i.test(h)?'money':'num';
 else if(/\b(id|no|number|code|ref|invoice)\b/i.test(h)&&u/n>.8)t='id';
 else if(/status|attendance|state|stage/i.test(h)&&u<=12)t='status';
 else if(u<=50&&u<n*.5)t='cat';
 P[h]={t,u,blank:w.length-vals.length}});st.P=P;
 const by=t=>H.filter(h=>P[h].t===t),pf=st.pf,pk=(k,l)=>H.includes(pf[k])?pf[k]:l,mon=by('money');let am=null;
 for(const re of[/revenue|total|amount|sales/i,/salary|value|cost|fee|profit/i,/price/i]){am=mon.find(h=>re.test(h));if(am)break}am=am||mon[0]||by('num')[0]||null;
 st.R={d:pk('d',by('date')[0]),a:pk('a',am),q:pk('q',by('qty')[0]),s:pk('s',by('status')[0]),i:by('id')[0],p:by('pct')[0],c:H.filter(h=>['cat','status'].includes(P[h].t)&&P[h].u>1).sort((a,b)=>P[a].u-P[b].u)}}
function prep(){const R=st.R;let mn='9',mx='';st.w.forEach(r=>{r.__d=R.d?toD(r[R.d],1):null;if(r.__d){const k=dk(r.__d);if(k<mn)mn=k;if(k>mx)mx=k}});st.mn=mx?mn:'';st.mx=mx;st.span=mx?(new Date(mx)-new Date(mn))/864e5:0}
function apply(){const R=st.R,q=st.q.toLowerCase();st.F=st.w.filter(r=>{if(R.d&&(st.from||st.to)){if(!r.__d)return false;const k=dk(r.__d);if((st.from&&k<st.from)||(st.to&&k>st.to))return false}
 for(const h in st.fl)if(st.fl[h]&&bl(r[h])!==st.fl[h])return false;return!q||st.H.some(h=>String(r[h]).toLowerCase().includes(q))});st.pg=0}
const go=()=>{apply();render()};
function refresh(){if(!st.w.length)return toast('Please upload an Excel or CSV file.');prof();prep();apply();render();toast('Dashboard refreshed.')}
function auto(){if(!st.w.length)return toast('Please upload an Excel or CSV file.');st.pf={};st.fl={};st.q='';st.from=st.to='';$('#q').value='';st.view='dash';refresh();toast('Dashboard rebuilt automatically from your headers.')}
function setFl(i,v){st.fl[st.R.c[i]]=v;go()}
function preset(p){const t=new Date(),a=new Date(t),d=x=>dk(x);let f='',e='';
 if(p==='today')f=e=d(t);else if(p==='yday'){a.setDate(a.getDate()-1);f=e=d(a)}else if(p==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));f=d(a);e=d(t)}
 else if(p==='month'){f=d(new Date(t.getFullYear(),t.getMonth(),1));e=d(t)}else if(p==='lmonth'){f=d(new Date(t.getFullYear(),t.getMonth()-1,1));e=d(new Date(t.getFullYear(),t.getMonth(),0))}
 else if(p==='year'){f=d(new Date(t.getFullYear(),0,1));e=d(t)}else if(p==='last')f=e=st.mx;st.from=f;st.to=e;go()}
/* ---------- analysis ---------- */
function qual(){const{w,H,P}=st;let bl=0,sp=0,inv=0,dt=0,dr=0,di=0,inc=0;const seen=new Set();
 w.forEach(r=>{const k=H.map(h=>String(r[h]).trim().toLowerCase()).join('|');seen.has(k)?dr++:seen.add(k);
  H.forEach(h=>{const v=r[h];if(v===''||v==null){bl++;return}if(typeof v==='string'&&(v!==v.trim()||/\s{2}/.test(v)))sp++;const t=P[h].t;if(t==='date'&&!toD(v,1))dt++;if(['money','qty','num','pct'].includes(t)&&!isNum(v))inv++})});
 if(st.R.i){const s=new Set();w.forEach(r=>{const v=String(r[st.R.i]).trim();if(v){s.has(v)?di++:s.add(v)}})}
 H.forEach(h=>{if(['cat','status'].includes(P[h].t)){const m=new Map();w.forEach(r=>{const v=String(r[h]).trim();if(!v)return;const k=v.toLowerCase().replace(/\s+/g,' ');if(!m.has(k))m.set(k,new Set());m.get(k).add(v)});m.forEach(s=>{if(s.size>1)inc++})}});
 const iss=bl+dr+dt+inv+sp+inc+di;return{bl,dr,di,dt,inv,sp,inc,score:Math.round((1-Math.min(1,iss/((w.length*H.length)||1)))*100)}}
function alerts(){const{R,F}=st,A=[];if(!F.length)return A;
 if(R.s)grp(F,r=>bl(r[R.s])).forEach(([k,o])=>{if(BAD.test(k)&&o.n)A.push(['r',`${nf(o.n)} record${o.n===1?' has':'s have'} ${R.s} "${k}".`])});
 const q=qual();if(q.dr)A.push(['a',`${q.dr} duplicate rows detected in the data.`]);if(q.bl)A.push(['a',`${q.bl} blank cells found.`]);
 if(R.a){const v=F.map(r=>N(r[R.a])),m=v.reduce((a,b)=>a+b,0)/v.length,sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length),c=sd?v.filter(x=>Math.abs(x-m)>3*sd).length:0;if(c)A.push(['a',`${c} unusually high/low ${R.a} value(s) (more than 3 standard deviations from average).`])}return A}
function delta(){const{R,F}=st;if(!R.d||!R.a)return'';const ks=[...new Set(F.filter(r=>r.__d).map(r=>dk(r.__d)))].sort();if(ks.length<4)return'';const h=new Set(ks.slice(0,Math.floor(ks.length/2))),D=F.filter(r=>r.__d);
 const a=sum(D.filter(r=>h.has(dk(r.__d))),R.a),b=sum(D.filter(r=>!h.has(dk(r.__d))),R.a);if(!a)return'';const p=(b/a-1)*100;return`<span class="dl" style="color:var(--${p>=0?'g':'r'})">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}% vs first half</span>`}
function insights(){const{R,F}=st,L=[];if(!F.length)return L;const s=R.a?sum(F,R.a):0;L.push(`${nf(F.length)} records in the current view.`);
 if(R.a)L.push(`Total ${R.a} is ${fa(s)}, average ${fa(s/F.length)} per record.`);
 R.c.filter(c=>c!==R.s).slice(0,3).forEach(c=>{const g=grp(F,r=>bl(r[c])).sort((a,b)=>b[1].v-a[1].v);if(g.length>1)L.push(`${g[0][0]} is the top ${c}`+(R.a?` with ${fa(g[0][1].v)} (${(g[0][1].v/s*100).toFixed(1)}% of total)`:` with ${g[0][1].n} records`)+`; the lowest is ${g[g.length-1][0]}.`)});
 if(R.s)grp(F,r=>bl(r[R.s])).sort((a,b)=>b[1].n-a[1].n).slice(0,3).forEach(([k,o])=>L.push(`${nf(o.n)} records are "${k}" (${(o.n/F.length*100).toFixed(1)}%).`));
 const ks=[...new Set(F.filter(r=>r.__d).map(r=>dk(r.__d)))].sort();
 if(R.d&&R.a&&ks.length>=4){const h=new Set(ks.slice(0,Math.floor(ks.length/2))),D=F.filter(r=>r.__d),a=sum(D.filter(r=>h.has(dk(r.__d))),R.a),b=sum(D.filter(r=>!h.has(dk(r.__d))),R.a);if(a)L.push(`${R.a} in the second half of the period is ${b>=a?'up':'down'} ${Math.abs((b/a-1)*100).toFixed(0)}% compared with the first half.`)}
 const q=qual();if(q.dr)L.push(`${q.dr} duplicate records were detected.`);if(q.bl)L.push(`${q.bl} blank cells were found.`);return L}
const filtTxt=()=>[st.from||st.to?`Date: ${st.from||'start'} to ${st.to||'end'}`:'',...Object.entries(st.fl).filter(e=>e[1]).map(e=>`${e[0]}: ${e[1]}`),st.q?`Search: "${st.q}"`:''].filter(Boolean).join(' | ')||'None (all data)';
function build(){const{R,F,P}=st,S=[],Mt=R.a,tot=Mt?sum(F,Mt):0,sc=R.s?grp(F,r=>bl(r[R.s])).sort((a,b)=>b[1].n-a[1].n):[];
 const sm=[['Records in report',nf(F.length)]];if(R.d&&F.some(r=>r.__d)){const k=F.filter(r=>r.__d).map(r=>dk(r.__d)).sort();sm.push(['Data period',k[0]+' to '+k[k.length-1]])}
